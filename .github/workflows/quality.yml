name: Quality gate
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    # The full gate outgrew 20 minutes on hosted runners; every stage keeps its own shorter limit.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      # Fixture PostgreSQL ports sit in Linux's ephemeral range, where a local client's TIME_WAIT socket can block their bind.
      - name: Keep fixture ports out of the ephemeral range
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=55400-55600
      - name: PostgreSQL fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 rsync ripgrep nginx
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - name: Clean build, audit and isolated PostgreSQL acceptance
        run: python3 scripts/verification/run_quality_gate.py --final-acceptance --report-dir "$RUNNER_TEMP/devcore-quality"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: quality-evidence
          path: ${{ runner.temp }}/devcore-quality
          retention-days: 7
